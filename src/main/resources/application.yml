spring:
  application:
    name: anilist-spring-boot
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
  servlet:
    context-path: /api

anilist:
  graphql:
    endpoint: https://graphql.anilist.co
    timeout-seconds: 10

logging:
  level:
    root: INFO
    com.example.anilist: DEBUG